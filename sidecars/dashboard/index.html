<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity Sync Dashboard</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand-left">
          <span class="brand-dot" id="sync-dot" aria-hidden="true"></span>
          <h1 class="brand-title" id="ui-title">Sync Dashboard</h1>
        </div>
        <div class="brand-actions">
          <span class="status-pill" id="sync-badge">--</span>
          <button type="button" class="icon-btn" id="btn-sync" aria-label="立即同步" title="立即同步">
            <span class="btn-label" id="ui-sync-label">同步</span>
          </button>
        </div>
      </div>

      <div class="tablist" role="tablist" aria-label="仪表盘视图">
        <button type="button" class="tab-btn" role="tab" id="tab-overview" aria-selected="true" aria-controls="panel-overview" tabindex="0">总览</button>
        <button type="button" class="tab-btn" role="tab" id="tab-devices" aria-selected="false" aria-controls="panel-devices" tabindex="-1">设备</button>
        <button type="button" class="tab-btn" role="tab" id="tab-models" aria-selected="false" aria-controls="panel-models" tabindex="-1">模型</button>
        <button type="button" class="tab-btn" role="tab" id="tab-settings" aria-selected="false" aria-controls="panel-settings" tabindex="-1">设置</button>
      </div>
    </header>

    <main class="panels">
      <section class="panel" role="tabpanel" id="panel-overview" aria-labelledby="tab-overview">
        <div id="overview-root" class="stack">
          <article class="card">
            <p class="muted" id="ui-loading">正在加载本机与多设备数据…</p>
          </article>
        </div>
      </section>

      <section class="panel" role="tabpanel" id="panel-devices" aria-labelledby="tab-devices" hidden>
        <div id="devices-root" class="stack"></div>
      </section>

      <section class="panel" role="tabpanel" id="panel-models" aria-labelledby="tab-models" hidden>
        <div id="models-root" class="stack"></div>
      </section>

      <section class="panel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
        <article class="card settings-card">
          <div class="card-head">
            <h2 class="card-title" id="ui-settings-title">多设备同步设置</h2>
            <span class="mono tag" id="settings-device-id">--</span>
          </div>
          <form id="settings-form" class="form-stack">
            <label class="field">
              <span class="field-label" id="ui-label-syncdir">同步文件夹路径 (Syncthing / 网盘)</span>
              <input class="input mono" id="input-syncdir" name="syncDir" type="text" placeholder="例如 D:\Sync\agy-sync-dashboard" autocomplete="off">
            </label>
            <div id="sync-candidates" class="candidates-row" hidden></div>

            <label class="field">
              <span class="field-label" id="ui-label-devicename">本机显示名称</span>
              <input class="input" id="input-devicename" name="deviceName" type="text" maxlength="48" autocomplete="off">
            </label>

            <label class="field">
              <span class="field-label" id="ui-label-lang">界面语言</span>
              <select class="input" id="input-lang" name="language">
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
              </select>
            </label>

            <div class="form-actions">
              <button type="submit" class="primary-btn" id="btn-save-settings">保存并立即同步</button>
              <span class="save-msg" id="settings-feedback" aria-live="polite"></span>
            </div>
          </form>

          <div class="diag-box" id="settings-diag"></div>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
