name: Publish to Open VSX

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-openvsx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build VSIX package
        run: npm run build:vsix

      - name: Publish to Open VSX
        run: npx --yes ovsx publish vscode-extension/dist/*.vsix --trusted-publishing
